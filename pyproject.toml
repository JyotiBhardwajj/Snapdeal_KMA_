[project]
name = "snapdeal-virtual-kam"
version = "1.0.0"
description = "Disha: a voice-first AI Virtual Key Account Manager for Snapdeal sellers (Gemini Live API)."
readme = "README.md"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::SyntaxWarning", "ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # allow ₹ and typographic characters in strings

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
